[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "facetwork"
version = "0.44.0"
description = "FFL (Facetwork Flow Language) compiler and runtime"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Ralph Lemke"}]
keywords = ["workflow", "compiler", "dsl", "agents", "distributed"]
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Compilers",
    "Topic :: System :: Distributed Computing",
]
dependencies = [
    "lark>=1.3.0",
]

[project.urls]
Homepage = "https://github.com/rlemke/facetwork"
Repository = "https://github.com/rlemke/facetwork"
Documentation = "https://github.com/rlemke/facetwork"
Changelog = "https://github.com/rlemke/facetwork/blob/main/spec/99_changelog.md"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.15.0",
    "mypy>=2.0.0",
    "pre-commit>=4.0.0",
    "types-requests>=2.31.0",
]
mongodb = [
    "pymongo>=4.0",
]
test = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "mongomock>=4.0",
    "requests>=2.28",
    "pyshp>=2.3",
]
dashboard = [
    # No upper bound: the route tests (tests/dashboard/test_app.py) check behavior
    # via TestClient, not app.routes introspection, so they survive fastapi's
    # include_router changes (the 0.136+ lazy `_IncludedRouter`). Verified on 0.138.
    "fastapi>=0.100",
    "uvicorn[standard]>=0.20",
    "jinja2>=3.1",
    "markdown>=3.5",
]
mcp = [
    # Cap below 2.0: mcp 2.0 renamed the Tool field (inputSchema -> input_schema)
    # and dropped Server.list_tools, which facetwork/mcp/server.py uses. Unpinned,
    # a fresh CI resolver pulled 2.0.0 and broke typecheck + tests/mcp. Stay on 1.x
    # until server.py is ported to the 2.0 API.
    "mcp>=1.0,<2",
]
hdfs = [
    "pyarrow>=14.0",
]
s3 = [
    "boto3>=1.28",
]

[project.scripts]
facetwork = "facetwork.cli:main"
facetwork-dashboard = "facetwork.dashboard.__main__:main"
facetwork-runner = "facetwork.runtime.runner.__main__:main"
facetwork-mcp = "facetwork.mcp.__main__:main"
facetwork-submit = "facetwork.runtime.submit:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["facetwork*"]

[tool.setuptools.package-data]
facetwork = [
    "grammar/*.lark",
    # ⚠️ The built-in facet libraries (fw.file / fw.http / fw.archive / fw.exec /
    # fw.compare). Without this line a pip-installed Facetwork has NONE of them:
    # `use fw.file` fails with "namespace 'fw.file' does not exist". Invisible in
    # this repo and on the fleet, because both run from a source tree or an image
    # built by COPY — it only appears when the package is actually installed,
    # which the new domain CI does on every push. Found 2026-09-03 by
    # fwh_gridbuilder and fwh_pypsa_data failing to compile.
    "ffl/*.ffl",
    "dashboard/templates/**/*.html",
    "dashboard/static/*.js",
    "dashboard/static/*.css",
]

[tool.pytest.ini_options]
testpaths = ["tests", "examples"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
log_file = "facetwork-test.log"
log_file_level = "DEBUG"
log_file_format = "%(asctime)s %(levelname)s [%(name)s] %(message)s"
log_file_date_format = "%Y-%m-%dT%H:%M:%S"

[tool.coverage.run]
source = ["facetwork"]
branch = true

[tool.coverage.report]
# Lowered 85 -> 75 to match current real coverage (~77%, measured on `facetwork`).
# This is a regression floor, not a target — ratchet it back up as coverage grows.
# Keep in sync with --cov-fail-under in .github/workflows/ci.yml.
fail_under = 75
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "raise NotImplementedError",
]

[tool.coverage.html]
directory = "htmlcov"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "E402",   # module level import not at top of file (logger setup pattern)
    "B008",   # do not perform function calls in argument defaults
    "B905",   # zip without strict= (python 3.10+)
]

[tool.ruff.lint.per-file-ignores]
"tests/runtime/test_hdfs_storage.py" = ["F811"]

[tool.ruff.lint.isort]
known-first-party = ["facetwork"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
warn_unused_ignores = true
check_untyped_defs = true
ignore_missing_imports = true
# Gradually tighten these settings as type coverage improves:
# disallow_untyped_defs = true
# disallow_incomplete_defs = true
# warn_return_any = true
# strict_optional = true

[[tool.mypy.overrides]]
module = "facetwork.runtime.mongo_store"
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = "tests.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "examples.*"
ignore_errors = true
