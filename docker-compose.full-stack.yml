  runner-osm-geocoder:
    # Durable cache + output → MinIO (osm-s3-env); staging/tmp/locks → /scratch (the LARGE external disk, NOT the small internal volume — continent extracts staged on the internal disk ENOSPC-crash the shared mongodb volume).
    # Timeouts raised to 4h: multi-GB Geofabrik downloads + osmium parses run for hours; the 15min/30min/5min defaults would kill long facets or let another runner steal a 30GB download mid-flight. Matches fwh_osm's DomainPackage runner_env.
    hostname: ${FW_FLEET_HOST:-}
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      postgis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *osm-s3-env
      FW_MONGODB_URL: mongodb://mongodb:27017
      FW_MONGODB_DATABASE: ${FW_MONGODB_DATABASE:-facetwork}
      FW_DOMAIN_NAME: osm-geocoder
      FW_DOMAIN_REPO: fwh_osm
      FW_POSTGIS_URL: postgresql://${POSTGRES_USER:-afl}:${POSTGRES_PASSWORD:-afl}@postgis:5432/${POSTGRES_DB:-afl_gis}
      FW_GEOFABRIK_MIRROR: /geofabrik
      FW_OSM_USE_CACHE_IF_PRESENT: ${FW_OSM_USE_CACHE_IF_PRESENT:-true}
      FW_OSM_TOLERATE_MD5: ${FW_OSM_TOLERATE_MD5:-true}
      FW_TASK_EXECUTION_TIMEOUT_MS: 14400000
      FW_STUCK_TIMEOUT_MS: 14400000
      FW_LEASE_DURATION_MS: 14400000
      FW_REGISTRY_RUNNER_ARGS: "--task-list osm --server-group ${FW_SERVER_GROUP:-default}"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_osm:/handlers/fwh_osm
      - afl_output:/data/output
      - ${FW_DATA_DIR:-/Volumes/afl_data}/osm-scratch:/scratch
      - afl_geofabrik:/geofabrik
    restart: unless-stopped

  runner-osm-lz:
    # Pure workflow catalog over fwh_osm — its facets dispatch to the osm-geocoder runner's handlers, so start that one first (depends_on) and mount fwh_osm read-only.
    # Same 4h timeouts + external scratch as osm-geocoder: it orchestrates continental fan-outs that stage multi-GB PBFs and run for hours.
    hostname: ${FW_FLEET_HOST:-}
    build:
