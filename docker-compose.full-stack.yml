# Facetwork full-stack development environment.
#
# One MongoDB + one PostGIS + one Jenkins + the Facetwork dashboard
# and main runner + a dedicated registry-mode runner per fwh_* example
# (anthropic, osm-geocoder, osm-lz, noaa-weather, jenkins-pipeline,
# census-us, genomics, sensor-monitoring).
#
# Each example runner stays small: it bind-mounts ~/fw_handlers/<repo>
# and pip-installs it editable at startup, so handler edits land in the
# running container without a rebuild.
#
# Start everything:
#   docker compose -f docker-compose.full-stack.yml up -d
#
# Just infra + dashboard:
#   docker compose -f docker-compose.full-stack.yml up -d \
#       mongodb postgis dashboard
#
# Watch a single example runner:
#   docker compose -f docker-compose.full-stack.yml logs -f runner-anthropic
#
# Tear down (keeps data volumes):
#   docker compose -f docker-compose.full-stack.yml down
#
# Tear down INCLUDING data:
#   docker compose -f docker-compose.full-stack.yml down -v
#
# Scale a runner — model multiple replicas of one example:
#   docker compose -f docker-compose.full-stack.yml \
#       up -d --scale runner-osm-geocoder=3
# (Runners coordinate purely through MongoDB; N replicas race for the
# same task list via atomic find_one_and_update. Infra services keep
# pinned container_names; runners use Compose's auto-naming so they're
# scalable — `docker logs <project>-runner-osm-geocoder-1` etc.)
#
# Storage: the OSM runners (osm-geocoder, osm-lz) write their durable
# cache + output to the bundled MinIO (S3) service. osm-geocoder STAGING is
# bind-mounted to the external disk (${AFL_DATA_DIR}/osm-scratch): continent
# extracts (europe ~30GB, north-america ~15GB) staged concurrently overflow
# the small internal Docker disk and ENOSPC-crash mongodb (which shares it via
# mongodb_data). Tradeoff: like MinIO's /data, osm-scratch is now coupled to
# the attached disk — if it ejects mid-download, restart the OSM runners after
# reconnect. Smaller runners' output/geofabrik mirror stay on internal-disk
# named volumes. Point the OSM fleet at a different S3/MinIO by overriding
# AFL_S3_ENDPOINT / AFL_S3_ACCESS_KEY / AFL_S3_SECRET_KEY / AFL_S3_BUCKET in .env.

# Reusable S3/MinIO env for the OSM runners — durable cache + output go to
# the object store; staging/tmp/locks stay on a local scratch volume.
x-osm-s3-env: &osm-s3-env
  AFL_STORAGE: s3
  AFL_DATA_ROOT: s3://${AFL_S3_BUCKET:-afl-cache}
  # Role group for fleet status / dashboard grouping. `start-runner --fleet`
  # sets AFL_SERVER_GROUP=runner; local full-stack leaves it at "default".
  AFL_SERVER_GROUP: ${AFL_SERVER_GROUP:-default}
  # Orchestration role (docs/architecture/ffl-runner-orchestration-tier.md).
  # Default "inline" so a bare `docker compose up` (no ffl tier) self-orchestrates.
  # start-all-workers sets AFL_HANDLER_CONTINUATION_MODE=off after bringing up the
  # ffl-runner tier, so handler runners stop owning the sweep/backlog.
  AFL_CONTINUATION_MODE: ${AFL_HANDLER_CONTINUATION_MODE:-inline}
  # 2 worker threads/runner. ToGeoJson's osmium export is long, and the workflow
  # orchestration needs a thread too — with only 1 thread, exports can stall
  # behind resume processing. Cap TOTAL concurrent exports via runner COUNT to
  # match BOTH the page cache (disk-backed node index ~2-3GB/region; >~6
  # concurrent seek-thrashes the single external disk) AND available RAM (osmium
  # way-assembly needs ~3-8GB/region for the largest extracts; on the 14GB VM,
  # >~2-3 concurrent OOM-kills india and the continents). 1 runner x 2 threads
  # = ~2 concurrent gives each big export ~5-6GB so india + the giants fit, at
  # ~3x lower throughput than the 3-runner config. AFL_MAX_CONCURRENT pins it.
  AFL_MAX_CONCURRENT: "1"
  # ToGeoJson size gate: skip regions whose cached PBF exceeds this many MB
  # (fallback when the workflow's max_pbf_mb param is 0). On this 14GB VM the
  # node index for extracts >~1GB PBF doesn't fit the page cache and seek-thrashes
  # to ~KB/s (the continents + big countries — us 10GB, africa 7.4GB, …), so cap
  # the bulk run at ~1GB and skip the rest. Raise/remove on a larger host.
  AFL_OSM_MAX_PBF_MB: "3072"
  AFL_OSM_OUTPUT_BASE: s3://${AFL_S3_BUCKET:-afl-cache}/osm-output
  AFL_S3_ENDPOINT: ${AFL_S3_ENDPOINT:-http://afl-minio:9000}
  AFL_S3_ACCESS_KEY: ${AFL_S3_ACCESS_KEY:-minioadmin}
  AFL_S3_SECRET_KEY: ${AFL_S3_SECRET_KEY:-minioadmin}
  AFL_S3_REGION: ${AFL_S3_REGION:-us-east-1}
  AFL_LOCAL_SCRATCH: /scratch
  # get_output_base()/get_temp_dir() — keep handler temp + local output on the
  # local scratch/output volumes, never on the object store. AFL_OUTPUT_BASE
  # points at the EXTERNAL scratch disk (not the internal /data/output volume)
  # because get_output_base() also roots the localize cache: reading a cached
  # PBF back from MinIO for osmium (e.g. ToGeoJson) downloads it there, and
  # europe (~30GB) would ENOSPC-crash the internal mongo disk otherwise.
  AFL_OUTPUT_BASE: /scratch/output
  AFL_LOCAL_OUTPUT_DIR: /data/output

# Read-only S3 access for services that only resolve s3:// step payloads
# (the dashboard) — no AFL_STORAGE switch, just endpoint + credentials.
x-s3-creds: &s3-creds
  AFL_S3_ENDPOINT: ${AFL_S3_ENDPOINT:-http://afl-minio:9000}
  AFL_S3_ACCESS_KEY: ${AFL_S3_ACCESS_KEY:-minioadmin}
  AFL_S3_SECRET_KEY: ${AFL_S3_SECRET_KEY:-minioadmin}
  AFL_S3_REGION: ${AFL_S3_REGION:-us-east-1}

# Generic S3 STORAGE for every per-example runner — cache + outputs finalize to
# the shared MinIO/S3 (s3://<bucket>), so a leaf produced anywhere and the merge
# run anywhere resolve the same objects (nothing siloed on a single host's disk).
# Object stores can't do partial writes, so handlers stage to a LOCAL scratch dir
# and finalize on close — those local paths live under the already-mounted
# /Volumes/afl_data (container-absolute, so they're correct regardless of the
# host's AFL_DATA_DIR). The OSM runners use their own *osm-s3-env anchor instead
# (PBF-specific tuning + external scratch volume).
x-s3-storage: &s3-storage
  AFL_STORAGE: s3
  AFL_DATA_ROOT: s3://${AFL_S3_BUCKET:-afl-cache}
  # Every RegistryRunner auto-loads the baked osm handlers, so ANY per-example
  # runner can be picked to serve an osm task. Without this, osm output falls
  # back to AFL_OUTPUT_BASE (local /Volumes scratch) — unreadable by the S3-backed
  # downstream steps (ByScript, MergeLayers) that run on a different runner, which
  # then dead-letter. Point osm output at the shared object store so a non-osm
  # runner that wins an osm claim writes where downstream can read it.
  AFL_OSM_OUTPUT_BASE: s3://${AFL_S3_BUCKET:-afl-cache}/osm-output
  # Same reason: an osm Download served on a non-osm runner has no Geofabrik
  # egress, so it must reuse the cached PBF as-is. cache_policy=prefer_cache in
  # the workflow covers current handler code; this env covers the fallback path.
  AFL_OSM_USE_CACHE_IF_PRESENT: ${AFL_OSM_USE_CACHE_IF_PRESENT:-true}
  # Role group, same as the osm runners: `start-runner --fleet` sets
  # AFL_SERVER_GROUP=runner so every per-example fleet runner groups under
  # "runner" (not "default"). The non-osm services don't pass --server-group in
  # AFL_REGISTRY_RUNNER_ARGS, so the runner falls back to this env value.
  AFL_SERVER_GROUP: ${AFL_SERVER_GROUP:-default}
  # Orchestration role — default "inline" (self-orchestrating) so a bare
  # `docker compose up` works without the ffl tier; start-all-workers sets
  # AFL_HANDLER_CONTINUATION_MODE=off once the ffl-runner tier is up. See
  # docs/architecture/ffl-runner-orchestration-tier.md.
  AFL_CONTINUATION_MODE: ${AFL_HANDLER_CONTINUATION_MODE:-inline}
  AFL_S3_ENDPOINT: ${AFL_S3_ENDPOINT:-http://afl-minio:9000}
  AFL_S3_ACCESS_KEY: ${AFL_S3_ACCESS_KEY:-minioadmin}
  AFL_S3_SECRET_KEY: ${AFL_S3_SECRET_KEY:-minioadmin}
  AFL_S3_REGION: ${AFL_S3_REGION:-us-east-1}
  AFL_LOCAL_SCRATCH: /Volumes/afl_data/scratch
  AFL_OUTPUT_BASE: /Volumes/afl_data/scratch/output
  AFL_LOCAL_OUTPUT_DIR: /Volumes/afl_data/output

services:

  # =====================================================================
  # Infrastructure
  # =====================================================================

  mongodb:
    image: mongo:7
    container_name: facetwork-mongodb
    command: ["--bind_ip_all", "--port", "27017"]
    ports:
      - "${AFL_MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  postgis:
    image: postgis/postgis:16-3.4
    container_name: facetwork-postgis
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-afl_gis}
      POSTGRES_USER: ${POSTGRES_USER:-afl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-afl}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./docker/postgis-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-afl} -d ${POSTGRES_DB:-afl_gis}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # MinIO — S3-compatible object store backing the OSM cache + output.
  # Object bytes are stored on the attached APFS disk (capacity), bind-mounted
  # at /data; override with AFL_MINIO_DATA_DIR. MinIO is the *only* service
  # coupled to the attached disk now (single, contained failure boundary) —
  # if the disk ejects mid-run, restart just this container after reconnect.
  # The path must be a case-sensitive POSIX FS (APFS/ext4); MinIO needs atomic
  # rename + xattrs. Do NOT point it at exFAT/FAT.
  minio:
    image: minio/minio
    container_name: facetwork-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${AFL_S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${AFL_S3_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - ${AFL_MINIO_DATA_DIR:-/Volumes/afl_data/minio}:/data
    # Resolve as `afl-minio` on the compose network too, so the unified default
    # endpoint (http://afl-minio:9000) works on the infra host exactly as it does
    # on remote runner hosts (which map afl-minio via extra_hosts). Keeps ONE
    # endpoint name fleet-wide.
    networks:
      default:
        aliases:
          - afl-minio
    restart: unless-stopped

  # One-shot: wait for MinIO, then create the bucket. Exits 0. OSM runners
  # depend on this completing so the bucket exists before first write.
  minio-setup:
    image: minio/mc
    container_name: facetwork-minio-setup
    depends_on:
      - minio
    environment:
      AFL_S3_ACCESS_KEY: ${AFL_S3_ACCESS_KEY:-minioadmin}
      AFL_S3_SECRET_KEY: ${AFL_S3_SECRET_KEY:-minioadmin}
      AFL_S3_BUCKET: ${AFL_S3_BUCKET:-afl-cache}
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 \"$$AFL_S3_ACCESS_KEY\" \"$$AFL_S3_SECRET_KEY\" >/dev/null 2>&1; do
        echo 'waiting for minio...'; sleep 2;
      done;
      mc mb --ignore-existing local/\"$$AFL_S3_BUCKET\";
      echo \"bucket local/$$AFL_S3_BUCKET ready\";
      "
    restart: "no"

  jenkins:
    image: jenkins/jenkins:lts
    container_name: facetwork-jenkins
    ports:
      - "${JENKINS_UI_PORT:-9090}:8080"
      - "${JENKINS_AGENT_PORT:-50000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8080/login || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 90s
    restart: unless-stopped

  # =====================================================================
  # Facetwork dashboard + main runner
  # =====================================================================

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: facetwork-dashboard
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_EXAMPLES_DATABASE: ${AFL_EXAMPLES_DATABASE:-afl_examples}
      AFL_POSTGIS_URL: postgresql://${POSTGRES_USER:-afl}:${POSTGRES_PASSWORD:-afl}@postgis:5432/${POSTGRES_DB:-afl_gis}
      # Local output volume (non-OSM examples write here). OSM durable output
      # now lives in MinIO — the S3 creds below let the dashboard resolve
      # s3:// step-payload paths; rendered OSM maps are served host-side via
      # fw util serve-map after localizing from S3.
      <<: *s3-creds
      AFL_LOCAL_OUTPUT_DIR: /data/output
      # Host-run runners write rendered outputs here (bind-mounted below); the
      # /output/raw artifact server checks it so it can serve those maps too.
      AFL_HOST_OUTPUT_DIR: /host_output
      # S3/MinIO output prefix(es) the /output/raw server proxies when an output
      # isn't on local disk (fleet runs that render to s3://). Comma-separated;
      # mirrors AFL_DATA_ROOT=s3://<bucket> + /output. Add osm-output here too if
      # you want OSM maps served by the dashboard instead of host-side.
      AFL_S3_OUTPUT_BASE: ${AFL_S3_OUTPUT_BASE:-s3://${AFL_S3_BUCKET:-afl-cache}/output}
    ports:
      - "${DASHBOARD_PORT:-8080}:8080"
    volumes:
      - afl_output:/data/output:ro
      - ${AFL_HOST_OUTPUT_DIR:-${HOME}/afl_data/output}:/host_output:ro
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # The "main" runner — runs against the built-in examples bundled
  # inside this repo (hello-agent, aws-lambda, devops-deploy, etc.).
  # The standalone fwh_* examples each get their own dedicated runner
  # below.
  runner:
    build:
      context: .
      dockerfile: docker/Dockerfile.runner
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_MAX_CONCURRENT: ${AFL_MAX_CONCURRENT:-4}
      AFL_POLL_INTERVAL_MS: ${AFL_POLL_INTERVAL_MS:-1000}
      AFL_LOCAL_OUTPUT_DIR: ${AFL_DATA_DIR:-/Volumes/afl_data}/output
      PYTHONPATH: /app
    volumes:
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
      - ./examples:/app/examples:ro
    restart: unless-stopped

  # =====================================================================
  # Per-domain runners — GENERATED from domains.json by `fw util gen-compose`.
  # Edit each domain's compose: {...} in the catalog and re-run gen-compose;
  # do NOT hand-edit between the markers. Non-catalog singletons (gh-router,
  # ffl) are hand-written below the region.
  # =====================================================================
  # >>> BEGIN generated domain runners (fw util gen-compose — do not edit) >>>
  runner-anthropic:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: anthropic
      AFL_DOMAIN_REPO: fwh_anthropic
      AFL_DOMAIN_EXTRAS: ${ANTHROPIC_EXTRAS:-agent_sdk,mcp}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      AFL_REGISTRY_RUNNER_ARGS: "--task-list anthropic"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_anthropic:/handlers/fwh_anthropic
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  runner-census-us:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: census-us
      AFL_DOMAIN_REPO: fwh_census_us
      CENSUS_API_KEY: ${CENSUS_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      AFL_REGISTRY_RUNNER_ARGS: "--task-list census"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_census_us:/handlers/fwh_census_us
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  runner-conflict:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: conflict
      AFL_DOMAIN_REPO: fwh_conflict
      AFL_REGISTRY_RUNNER_ARGS: "--task-list conflict"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_conflict:/handlers/fwh_conflict
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  runner-osm-mapping:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: osm-mapping
      AFL_DOMAIN_REPO: fwh_osm_mapping
      AFL_REGISTRY_RUNNER_ARGS: "--task-list osm_mapping"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_osm_mapping:/handlers/fwh_osm_mapping
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  runner-genomics:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: genomics
      AFL_DOMAIN_REPO: fwh_genomics
      AFL_REGISTRY_RUNNER_ARGS: "--task-list genomics"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_genomics:/handlers/fwh_genomics
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  runner-jenkins-example:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: jenkins
      AFL_DOMAIN_REPO: fwh_jenkins
      JENKINS_URL: http://jenkins:8080
      AFL_REGISTRY_RUNNER_ARGS: "--task-list jenkins"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_jenkins:/handlers/fwh_jenkins
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  runner-noaa-weather:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: noaa-weather
      AFL_DOMAIN_REPO: fwh_noaa_weather
      AFL_REGISTRY_RUNNER_ARGS: "--task-list weather"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_noaa_weather:/handlers/fwh_noaa_weather
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  runner-osm-geocoder:
    # Durable cache + output → MinIO (osm-s3-env); staging/tmp/locks → /scratch (the LARGE external disk, NOT the small internal volume — continent extracts staged on the internal disk ENOSPC-crash the shared mongodb volume).
    # Timeouts raised to 4h: multi-GB Geofabrik downloads + osmium parses run for hours; the 15min/30min/5min defaults would kill long facets or let another runner steal a 30GB download mid-flight. Matches fwh_osm's DomainPackage runner_env.
    hostname: ${AFL_FLEET_HOST:-}
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      postgis:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *osm-s3-env
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: osm-geocoder
      AFL_DOMAIN_REPO: fwh_osm
      AFL_POSTGIS_URL: postgresql://${POSTGRES_USER:-afl}:${POSTGRES_PASSWORD:-afl}@postgis:5432/${POSTGRES_DB:-afl_gis}
      AFL_GEOFABRIK_MIRROR: /geofabrik
      AFL_OSM_USE_CACHE_IF_PRESENT: ${AFL_OSM_USE_CACHE_IF_PRESENT:-true}
      AFL_OSM_TOLERATE_MD5: ${AFL_OSM_TOLERATE_MD5:-true}
      AFL_TASK_EXECUTION_TIMEOUT_MS: 14400000
      AFL_STUCK_TIMEOUT_MS: 14400000
      AFL_LEASE_DURATION_MS: 14400000
      AFL_REGISTRY_RUNNER_ARGS: "--task-list osm --server-group ${AFL_SERVER_GROUP:-default}"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_osm:/handlers/fwh_osm
      - afl_output:/data/output
      - ${AFL_DATA_DIR:-/Volumes/afl_data}/osm-scratch:/scratch
      - afl_geofabrik:/geofabrik
    restart: unless-stopped

  runner-osm-lz:
    # Pure workflow catalog over fwh_osm — its facets dispatch to the osm-geocoder runner's handlers, so start that one first (depends_on) and mount fwh_osm read-only.
    # Same 4h timeouts + external scratch as osm-geocoder: it orchestrates continental fan-outs that stage multi-GB PBFs and run for hours.
    hostname: ${AFL_FLEET_HOST:-}
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      runner-osm-geocoder:
        condition: service_started
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *osm-s3-env
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: osm-lz
      AFL_DOMAIN_REPO: fwh_osm_lz
      AFL_POSTGIS_URL: postgresql://${POSTGRES_USER:-afl}:${POSTGRES_PASSWORD:-afl}@postgis:5432/${POSTGRES_DB:-afl_gis}
      AFL_TASK_EXECUTION_TIMEOUT_MS: 14400000
      AFL_STUCK_TIMEOUT_MS: 14400000
      AFL_LEASE_DURATION_MS: 14400000
      AFL_REGISTRY_RUNNER_ARGS: "--task-list continental"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_osm_lz:/handlers/fwh_osm_lz
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_osm:/handlers/fwh_osm:ro
      - afl_output:/data/output
      - ${AFL_DATA_DIR:-/Volumes/afl_data}/osm-scratch:/scratch
    restart: unless-stopped

  runner-save-earth:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: save-earth
      AFL_DOMAIN_REPO: fwh_save_earth
      AFL_REGISTRY_RUNNER_ARGS: "--task-list save_earth"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_save_earth:/handlers/fwh_save_earth
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  runner-sensor-monitoring:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *s3-storage
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_DOMAIN_NAME: sensor-monitoring
      AFL_DOMAIN_REPO: fwh_sensor_monitoring
      AFL_REGISTRY_RUNNER_ARGS: "--task-list monitor"
    volumes:
      - ${FWH_HANDLERS_ROOT:-$HOME/fw_handlers}/fwh_sensor_monitoring:/handlers/fwh_sensor_monitoring
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped
  # <<< END generated domain runners <<<

  # Embedded-GraphHopper Java routing agent (osm.Routing.GraphHopper.RouteBatch).
  # Built from fwh_osm/java/osm-gh-router (its own image, NOT the generic
  # facetwork-runner), pinned fleet-wide via AFL_GH_ROUTER_IMAGE (fleet_config
  # role `gh-router`). Coexists with the Python osm runners via the name-filtered
  # claim — it advertises only RouteBatch and polls the `osm` task list. Run at a
  # single replica (it loads a whole state graph into JVM heap per region).
  runner-gh-router:
    image: ${AFL_GH_ROUTER_IMAGE:-osm-gh-router:latest}
    pull_policy: ${AFL_RUNNER_PULL_POLICY:-missing}
    hostname: ${AFL_FLEET_HOST:-}
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *osm-s3-env
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      AFL_TASK_LIST: osm
    restart: unless-stopped

  # =====================================================================
  # ffl-runner — dedicated orchestration tier (continuation_mode=shared).
  #
  # Owns the stuck-step sweep (and, in the RegistryRunner model, the shared
  # _fw_continue backlog), so handler runners can run --continuation off and
  # the blast radius of a step-state-machine change shrinks to this small,
  # homogeneous role. Runs the CORE ENGINE ONLY (no example handlers,
  # no --registry), so heavy handler work never starves orchestration — a
  # bulkhead. Bring up >=2 for liveness:
  #   start-runner --fleet --example ffl --replicas 2
  # See docs/architecture/ffl-runner-orchestration-tier.md.
  # =====================================================================
  runner-ffl:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    # Bypass entrypoint-domain-runner.sh (which requires an example to seed);
    # run the runner core directly. AFL_CONTINUATION_MODE=shared (below) makes
    # it own the sweep + backlog.
    entrypoint: ["python", "-m", "facetwork.runtime.runner", "--log-format", "text"]
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
      <<: *s3-storage
      AFL_CONTINUATION_MODE: shared
      # Tag the tier so it groups separately in fleet status / the dashboard.
      # Use a DEDICATED var, not the shared AFL_SERVER_GROUP: fleet-agent forces
      # AFL_SERVER_GROUP=runner for all its runners, which would otherwise drag
      # the ffl tier into the "runner" group. AFL_FFL_SERVER_GROUP is unset by
      # fleet-agent, so this defaults to "ffl-runner" on every host.
      AFL_SERVER_GROUP: ${AFL_FFL_SERVER_GROUP:-ffl-runner}
    volumes:
      - ${AFL_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  # =====================================================================
  # One-shot seed: populates FlowDefinition + WorkflowDefinition entities
  # so the dashboard's "Flows" tab has something to show.
  #
  # Started automatically via `up`; exits 0 once seeding completes.
  # `restart: "no"` keeps it from looping after success.
  # =====================================================================
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    container_name: facetwork-seed
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      AFL_MONGODB_URL: mongodb://mongodb:27017
      AFL_MONGODB_DATABASE: ${AFL_MONGODB_DATABASE:-facetwork}
    restart: "no"

# Persistent volumes — on Docker's internal disk. Exception: MinIO's object
# store is bind-mounted to the attached APFS disk (see the minio service /
# AFL_MINIO_DATA_DIR) for capacity, so afl_minio_data is no longer used.
volumes:
  mongodb_data:
  postgis_data:
  jenkins_home:
  afl_output:        # shared local handler output (dashboard serves from here)
  afl_scratch:       # OSM local scratch: staging / tmp / locks (stage-then-finalize)
  afl_geofabrik:     # OSM Geofabrik PBF mirror (optional local download cache)

# Enable IPv6 on the project's default network so OSM runners can reach
# download.geofabrik.de over IPv6 (Geofabrik's IPv4 endpoints are
# intermittently unreachable from this host; IPv6 stays up). Requires the
# daemon to have "ipv6": true + "ip6tables": true (see ~/.docker/daemon.json).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:cafe:e701::/64
