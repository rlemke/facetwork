  # <<< END generated domain runners <<<

  # Embedded-GraphHopper Java routing agent (osm.Routing.GraphHopper.RouteBatch).
  # Built from fwh_osm/java/osm-gh-router (its own image, NOT the generic
  # facetwork-runner), pinned fleet-wide via FW_GH_ROUTER_IMAGE (fleet_config
  # role `gh-router`). Coexists with the Python osm runners via the name-filtered
  # claim — it advertises only RouteBatch and polls the `osm` task list. Run at a
  # single replica (it loads a whole state graph into JVM heap per region).
  runner-gh-router:
    image: ${FW_GH_ROUTER_IMAGE:-osm-gh-router:latest}
    pull_policy: ${FW_RUNNER_PULL_POLICY:-missing}
    hostname: ${FW_FLEET_HOST:-}
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      <<: *osm-s3-env
      FW_MONGODB_URL: mongodb://mongodb:27017
      FW_MONGODB_DATABASE: ${FW_MONGODB_DATABASE:-facetwork}
      FW_TASK_LIST: osm
    restart: unless-stopped

  # =====================================================================
  # ffl-runner — dedicated orchestration tier (continuation_mode=shared).
  #
  # Owns the stuck-step sweep (and, in the RegistryRunner model, the shared
  # _fw_continue backlog), so handler runners can run --continuation off and
  # the blast radius of a step-state-machine change shrinks to this small,
  # homogeneous role. Runs the CORE ENGINE ONLY (no example handlers,
  # no --registry), so heavy handler work never starves orchestration — a
  # bulkhead. Bring up >=2 for liveness:
  #   start-runner --fleet --example ffl --replicas 2
  # See docs/architecture/ffl-runner-orchestration-tier.md.
  # =====================================================================
  runner-ffl:
    build:
      context: .
      dockerfile: docker/Dockerfile.domain-runner
    # Bypass entrypoint-domain-runner.sh (which requires an example to seed);
    # run the runner core directly. FW_CONTINUATION_MODE=shared (below) makes
    # it own the sweep + backlog.
    entrypoint: ["python", "-m", "facetwork.runtime.runner", "--log-format", "text"]
    depends_on:
      mongodb:
        condition: service_healthy
      minio-setup:
        condition: service_completed_successfully
    environment:
      FW_MONGODB_URL: mongodb://mongodb:27017
      FW_MONGODB_DATABASE: ${FW_MONGODB_DATABASE:-facetwork}
      <<: *s3-storage
      FW_CONTINUATION_MODE: shared
      # Tag the tier so it groups separately in fleet status / the dashboard.
      # Use a DEDICATED var, not the shared FW_SERVER_GROUP: fleet-agent forces
      # FW_SERVER_GROUP=runner for all its runners, which would otherwise drag
      # the ffl tier into the "runner" group. FW_FFL_SERVER_GROUP is unset by
      # fleet-agent, so this defaults to "ffl-runner" on every host.
      FW_SERVER_GROUP: ${FW_FFL_SERVER_GROUP:-ffl-runner}
    volumes:
      - ${FW_DATA_DIR:-/Volumes/afl_data}:/Volumes/afl_data
    restart: unless-stopped

  # =====================================================================
  # One-shot seed: populates FlowDefinition + WorkflowDefinition entities
  # so the dashboard's "Flows" tab has something to show.
  #
  # Started automatically via `up`; exits 0 once seeding completes.
  # `restart: "no"` keeps it from looping after success.
  # =====================================================================
  seed:
    build:
      context: .
      dockerfile: docker/Dockerfile.seed
    container_name: facetwork-seed
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      FW_MONGODB_URL: mongodb://mongodb:27017
      FW_MONGODB_DATABASE: ${FW_MONGODB_DATABASE:-facetwork}
    restart: "no"

# Persistent volumes — on Docker's internal disk. Exception: MinIO's object
# store is bind-mounted to the attached APFS disk (see the minio service /
# FW_MINIO_DATA_DIR) for capacity, so afl_minio_data is no longer used.
volumes:
  mongodb_data:
  postgis_data:
  jenkins_home:
  afl_output:        # shared local handler output (dashboard serves from here)
  afl_scratch:       # OSM local scratch: staging / tmp / locks (stage-then-finalize)
  afl_geofabrik:     # OSM Geofabrik PBF mirror (optional local download cache)

# Enable IPv6 on the project's default network so OSM runners can reach
# download.geofabrik.de over IPv6 (Geofabrik's IPv4 endpoints are
# intermittently unreachable from this host; IPv6 stays up). Requires the
# daemon to have "ipv6": true + "ip6tables": true (see ~/.docker/daemon.json).
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: fd00:cafe:e701::/64
