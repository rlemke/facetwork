# Facetwork fleet MongoDB — the control plane.
#
# Deployed on beelink01 since 2026-09-13, moved off the infra host (server3);
# MinIO/PostGIS/registry/dashboard stayed there. Because the two are no longer
# co-located, the afl-* names resolve PER SERVICE from servers.json — see
# _fleet_lib.service_ips and docs/operations/deployment.md.
#
#   cd ~/facetwork && docker compose -f docker-compose.mongodb.yml up -d
#
# FW_MONGO_DATA_DIR points at the parent holding data/ and config/.
#
# ⚠️ THE DATA LIVES ON THE ROOT FILESYSTEM, ON PURPOSE.
#
# It was first placed on the second NVMe at /run/media/<user>/data — a udisks
# SESSION auto-mount, not an fstab entry. That cost the fleet its control plane
# for 2.5h on 2026-09-13: the host rebooted, Docker started at 13:22:02, and
# udisks did not mount the volume until 13:26:40. The bind refused (correctly)
# and mongod never came up. The same reboot also SWAPPED the two identical NVMe
# device names (nvme1n1p4 -> nvme0n1p4), so even an fstab entry had to be by
# UUID rather than device path.
#
# The root filesystem is mounted before Docker by construction, so none of that
# applies here. And capacity was never the reason to use the other disk: this
# database is ~430 MB against 848 GB free on /. Reliability was the constraint;
# the control plane belongs on the volume that cannot be absent.
#
# ⚠️ create_host_path: false is KEPT as a belt-and-braces guard. With the usual
# short `-v a:b` syntax, a missing source means Docker CREATES AN EMPTY DIRECTORY,
# mongod initialises a BRAND-NEW EMPTY DATABASE, and the fleet's control plane
# silently resets while the healthcheck reports green. Do not "simplify" it.
services:
  mongodb:
    image: mongo:7
    container_name: facetwork-mongodb
    command: ["--bind_ip_all", "--port", "27017"]
    ports:
      - "27017:27017"
    volumes:
      - type: bind
        source: ${FW_MONGO_DATA_DIR:-/home/ralph_lemke/fw-mongodb}/data
        target: /data/db
        bind:
          create_host_path: false
      - type: bind
        source: ${FW_MONGO_DATA_DIR:-/home/ralph_lemke/fw-mongodb}/config
        target: /data/configdb
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped
    # ⚠️ MongoDB needs a high file-descriptor limit — one per connection, and this
    # fleet opens 108 runners x a pymongo pool. server3 never showed this because
    # Docker Desktop's VM hands containers a large default; native Docker on Linux
    # gives the daemon's default (1024 soft), and mongod hit it within minutes of
    # the cutover: "Unable to create eventfd object ... Too many open files,
    # errno: 24", after which it accepted NO new connections while the container
    # still reported Up. MongoDB's own production checklist asks for 64000.
    ulimits:
      nofile:
        soft: 64000
        hard: 64000
