# Fleet runner override — run per-example runner containers on an ADDITIONAL
# server that JOINs an existing fleet's EXTERNAL, SHARED MinIO + MongoDB. This
# host runs runners only: no bundled mongodb / minio / postgis. Layer it on top
# of the full-stack file.
#
#   fw runner start --fleet                          # default: osm-geocoder + osm-lz
#   fw runner start --fleet --example noaa-weather   # any per-example runner
#   fw runner start --fleet --example census-us --example genomics
#
# (Or directly:
#   docker compose -f docker-compose.full-stack.yml -f docker-compose.fleet.yml \
#     --env-file .env.fleet up -d --scale runner-osm-geocoder=$FW_OSM_REPLICAS \
#     runner-osm-geocoder runner-osm-lz )
#
# `start-runner --fleet` preflight-checks the shared services first and maps each
# --example NAME to its `runner-NAME` compose service.
#
# REQUIRED in .env.fleet: FW_MONGODB_URL and FW_S3_ENDPOINT — the shared
# services, reachable over the network from this host. FW_DATA_DIR must point at
# a LARGE LOCAL disk on this server: scratch/staging stays local; outputs finalize
# to the shared MinIO (portable s3:// URIs any runner on any host can resolve, so
# a runner here can produce a leaf and the merge — anywhere — pulls it back).
#
# ALL per-example runners default to S3 storage (FW_STORAGE=s3) in the full-stack
# file, so every example's cache + output finalize to the shared MinIO — outputs
# are never siloed per host. This override just repoints them at the shared
# endpoint (FW_S3_ENDPOINT) and drops the local-infra dependency.
#
# FW_RUNNER_IMAGE pins the runner image fleet-wide (a registry tag for a real
# fleet, so every server runs the same build). With pull_policy=missing it uses a
# locally-built image of that tag if present, else pulls. The fleet controller
# sets it from fleet_config.roles.*.image; an image change triggers a recreate.
# All per-example runners build from the SAME docker/Dockerfile.domain-runner
# (the domain is chosen at runtime via FW_DOMAIN_NAME), so one image tag serves
# every example.

# ── Shared fleet-join override, applied to every per-example runner ──────────
# `depends_on: !reset []` drops the local-infra dependency so the runners don't
# try to start (or wait on) a bundled mongodb/minio that doesn't exist here.
# extra_hosts make the conventional names resolve INSIDE the runner containers:
# Docker's DNS does NOT resolve mDNS/.local names and containers don't read the
# host's /etc/hosts, so an `afl-mongodb`/`afl-minio` name needs an explicit map
# (FW_INFRA_IP=<infra host IP>). Otherwise put the infra host's IP directly in
# FW_MONGODB_URL / FW_S3_ENDPOINT and these mappings are harmlessly unused.
x-fleet-runner: &fleet-runner
  image: ${FW_RUNNER_IMAGE:-facetwork-runner-osm-geocoder:latest}
  pull_policy: ${FW_RUNNER_PULL_POLICY:-missing}
  # On `docker compose up --recreate` (how a fleet image rollout lands) the runner
  # gets SIGTERM and drains in-flight tasks for up to shutdown_timeout_ms (30s, see
  # runner/service.py RunnerConfig). Docker's DEFAULT grace is only 10s, which would
  # SIGKILL mid-drain — orphaning running tasks until the ~2-3min reaper resets them.
  # 35s (slightly over the 30s drain) lets the runner exit cleanly first, so a
  # rollout finishes in-flight tasks instead of killing them. Override per-host with
  # FW_RUNNER_STOP_GRACE if some handlers need longer.
  stop_grace_period: ${FW_RUNNER_STOP_GRACE:-35s}
  # Register under a meaningful name (set by start-runner to this host's hostname
  # / FW_FLEET_HOST) so `fleet status` shows the server by name, not a random id.
  hostname: ${FW_FLEET_HOST:-}
  # FW_INFRA_IP is normally set for you: runner/start resolves FW_INFRA_HOST
  # (a stable NAME, default server3.local) to the infra host's CURRENT IP via
  # mDNS/DNS and exports it here, so these mappings track DHCP drift with no
  # per-host edit — the name is stable even when the address changes. When that
  # host is THIS machine (standalone / `fw mode local`) the value is Docker's
  # `host-gateway` alias instead of an address: Docker maintains it, so it
  # cannot go stale when this box reboots onto a new lease. The
  # literal below is only a last-resort fallback if that resolution is skipped
  # or fails. To pin a fixed address, set FW_INFRA_HOST="" + FW_INFRA_IP=<ip>.
  # Fallback is 127.0.0.1 (a VALID address, so `compose config` still enumerates
  # services) rather than a real infra IP: if resolution was skipped, the runner
  # fails fast against localhost instead of silently pointing at a stale/foreign
  # address — the exact class of bug the name-based resolution removes.
  extra_hosts:
    - "afl-mongodb:${FW_INFRA_IP:-127.0.0.1}"
    - "afl-minio:${FW_INFRA_IP:-127.0.0.1}"

# NOTE: `depends_on: !reset []` must sit DIRECTLY on each service, not in the
# anchor above — Compose's `!reset` tag is not preserved through a `<<:` alias
# merge, so anchoring it silently leaves the base file's infra deps in place
# (the runner then tries to start the bundled mongodb/postgis/minio on a
# runner-only host). Keep it inline per service below.

# Merged into each runner's `environment` (compose deep-merges env maps; these
# keys override the base file's localhost defaults with the shared endpoints).
x-fleet-env: &fleet-env
  FW_MONGODB_URL: ${FW_MONGODB_URL:?set FW_MONGODB_URL to the shared MongoDB, e.g. mongodb://afl-mongodb:27017}
  FW_S3_ENDPOINT: ${FW_S3_ENDPOINT:?set FW_S3_ENDPOINT to the shared MinIO, e.g. http://afl-minio:9000}
  FW_POSTGIS_URL: ${FW_POSTGIS_URL:-}

services:
  runner-anthropic:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-osm-geocoder:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env
      # Self-hosted OSM extract source — our own "Geofabrik" served from MinIO
      # (s3://osm-extracts). CONTINENTS-ONLY today: the 8 continent extracts
      # resolve; finer regions on the geofabrik path 404 (extract more osmfr
      # .poly regions to widen coverage). Replaces the IP-banned Geofabrik host
      # so continent downloads work again. Override per-host in .env.fleet.
      FW_GEOFABRIK_BASE_URL: ${FW_GEOFABRIK_BASE_URL:-http://afl-minio:9000/osm-extracts}

  runner-osm-lz:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env
      FW_GEOFABRIK_BASE_URL: ${FW_GEOFABRIK_BASE_URL:-http://afl-minio:9000/osm-extracts}

  # Java routing agent — its own image (FW_GH_ROUTER_IMAGE), not the shared
  # FW_RUNNER_IMAGE; the explicit `image:` overrides the anchor's default.
  runner-gh-router:
    <<: *fleet-runner
    image: ${FW_GH_ROUTER_IMAGE:-osm-gh-router:latest}
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-noaa-weather:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-jenkins-example:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-census-us:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-conflict:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  # county-atlas MUST be here even though it isn't a fleet_config role: it is
  # `fleet_default: true` in domains.json, so agents start it, and its
  # full-stack block only has `build:` — with no override it runs a LOCALLY
  # BUILT image that no `fw fleet rollout` can ever update. That is not
  # hypothetical: its stale image sat 29h behind, didn't understand the `after`
  # clause, rebuilt a dependency graph without the ordering edge, and created a
  # step while its producer was still running. Every runner the fleet starts
  # must run the rolled image.
  runner-county-atlas:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  # amr and migration are NOT `fleet_default` today, so no agent starts them —
  # but their full-stack blocks are `build:`-only, so the day either is flagged
  # fleet_default (or someone names it via --example) it silently runs a LOCALLY
  # BUILT image that no `fw fleet rollout` can update. That is the county-atlas
  # bug above, which sat 29h behind, did not understand the `after` clause, and
  # created a step while its producer was still running. Cheaper to carry two
  # inert stanzas than to rediscover that. Every runner the fleet can start must
  # be pinned to the rolled image.
  runner-amr:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-migration:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-stocks:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env
      # Market-data backend. Keep this at yfinance on the fleet: `stub` serves
      # SYNTHETIC prices and must never back a real group.
      FW_STOCKS_PROVIDER: ${FW_STOCKS_PROVIDER:-yfinance}

  runner-osm-mapping:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-h1b:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-congress:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-livability:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-health:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-genomics:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-gridbuilder:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env
      # earth-osm's PBF cache. Repeated from the full-stack block because
      # `environment` is replaced by this override, not merged into it.
      FW_GRIDBUILDER_DATA_DIR: /Volumes/afl_data/earth-osm

  runner-sensor-monitoring:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-save-earth:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  runner-cancer:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  # Generalist runner: one container fronting every domain in the catalog's
  # `consolidated` set (see domains.local.json). It needs the same override as
  # any other runner — without one a fleet host would BUILD it locally and no
  # `fleet set --image` rollout could ever update it, which is exactly the
  # version-skew failure this file exists to prevent.
  runner-generalist:
    <<: *fleet-runner
    depends_on: !reset []
    environment:
      <<: *fleet-env

  # Orchestration tier (continuation_mode=shared, set in the full-stack file).
  # Shares the core runner image by default so `fleet set --image` rolls it
  # along with the handler runners; pin it independently with FW_FFL_IMAGE to
  # roll an engine change to ONLY the ffl tier. Brought up by fleet-agent when
  # the ffl-runner role is configured (`fleet set --ffl-replicas N`).
  runner-ffl:
    <<: *fleet-runner
    image: ${FW_FFL_IMAGE:-${FW_RUNNER_IMAGE:-facetwork-runner-osm-geocoder:latest}}
    depends_on: !reset []
    environment:
      <<: *fleet-env
