name: Docker

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - image: dashboard
            dockerfile: docker/Dockerfile.dashboard
          - image: runner
            dockerfile: docker/Dockerfile.runner
          - image: agent
            dockerfile: docker/Dockerfile.agent
          - image: seed
            dockerfile: docker/Dockerfile.seed
          - image: mcp
            dockerfile: docker/Dockerfile.mcp

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/afl-${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Integration test: verify all images build successfully
  integration:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request'

    # The base compose targets external infra (afl-mongodb on a LAN IP); the CI
    # override adds an ephemeral mongo and repoints the apps at it. CI-safe output
    # dirs avoid the /Volumes/* bind mounts the base compose defaults to.
    env:
      COMPOSE_FILE: docker-compose.yml:docker-compose.ci.yml
      AFL_LOCAL_OUTPUT_DIR: /tmp/fw-output
      AFL_OSM_OUTPUT_BASE: /tmp/fw-osm-output
      AFL_GEOFABRIK_MIRROR: /tmp/fw-osm-mirror

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build the addone-example stack
        run: docker compose build dashboard runner agent-addone seed

      - name: Start core services
        run: |
          mkdir -p "$AFL_LOCAL_OUTPUT_DIR" "$AFL_OSM_OUTPUT_BASE" "$AFL_GEOFABRIK_MIRROR"
          # depends_on waits for the mongo healthcheck before the apps start.
          docker compose up -d mongodb dashboard runner agent-addone

      - name: Check service health
        run: |
          docker compose ps
          for i in $(seq 1 30); do
            curl -fs http://localhost:8080/health && { echo "dashboard healthy"; exit 0; }
            sleep 2
          done
          echo "dashboard did not become healthy" >&2
          docker compose logs dashboard
          exit 1

      - name: Run seed
        run: docker compose --profile seed run --rm seed

      - name: Check seeded data
        run: |
          # Verify seeding populated flows the dashboard serves. The inline
          # examples (addone/chain/parallel) are seeded as the "inline-examples"
          # flow (see docker/seed/seed.py main()).
          for i in $(seq 1 15); do
            curl -s http://localhost:8080/api/flows | grep -q "inline-examples" && { echo "seeded"; exit 0; }
            sleep 2
          done
          echo "inline-examples flow not found in /api/flows" >&2
          curl -s http://localhost:8080/api/flows | head -c 2000 >&2
          exit 1

      - name: Run AddOneWorkflow end-to-end (agent processes the task)
        run: |
          set -e
          # Real run through the dashboard (anonymous user): AddOne(5) -> 6. The
          # runner bootstraps the workflow and dispatches the AddOne event to the
          # agent-addone container; the run can only reach "completed" if the
          # agent actually processed the task.
          flow_id=$(curl -s http://localhost:8080/api/flows | jq -r '.[]|select(.name=="inline-examples").uuid')
          [ -n "$flow_id" ] && [ "$flow_id" != "null" ] || { echo "inline-examples flow not found" >&2; exit 1; }
          wf_id=$(docker compose exec -T mongodb mongosh afl --quiet --eval \
            'var w=db.workflows.findOne({name:"handlers.AddOneWorkflow"}); print(w ? w.uuid : "")' | tr -d '\r\n ')
          [ -n "$wf_id" ] || { echo "handlers.AddOneWorkflow not found in db" >&2; exit 1; }
          echo "flow=$flow_id wf=$wf_id"
          redir=$(curl -s -o /dev/null -w '%{redirect_url}' -X POST \
            "http://localhost:8080/v3/flows/$flow_id/run/$wf_id" \
            --data-urlencode 'inputs_json={"input": 5}' --data-urlencode 'purpose=none')
          runner_id="${redir##*/}"
          [ -n "$runner_id" ] || { echo "submit returned no runner ($redir)" >&2; exit 1; }
          echo "runner_id=$runner_id"
          for i in $(seq 1 45); do
            state=$(curl -s "http://localhost:8080/api/runners/$runner_id" | jq -r '.state // empty')
            echo "poll $i: state=$state"
            case "$state" in
              completed) echo "AddOneWorkflow completed — agent-addone processed AddOne(5)=6"; exit 0 ;;
              failed|error) echo "run $state" >&2; curl -s "http://localhost:8080/api/runners/$runner_id" >&2; break ;;
            esac
            sleep 2
          done
          echo "AddOneWorkflow did not complete" >&2
          docker compose logs --tail 60 runner agent-addone >&2
          exit 1

      - name: Cleanup
        if: always()
        run: docker compose down -v
